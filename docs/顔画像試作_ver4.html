<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>顔画像の試作 — 男女各10枚 ver4</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #242a2b; background: #f8f8f5; font: 16px/1.75 system-ui, sans-serif; }
    main, header, footer { max-width: 1500px; margin: auto; padding: 24px; }
    header { padding-top: 40px; padding-bottom: 8px; }
    .eyebrow { margin: 0; color: #60726d; font-size: 13px; letter-spacing: .12em; }
    h1 { margin: 6px 0 12px; font-size: clamp(26px, 4vw, 40px); line-height: 1.4; }
    header p { margin: 8px 0; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; margin-top: 24px; }
    .versions { display: flex; gap: 4px; padding: 4px; border: 1px solid #d9e1dc; border-radius: 10px; background: white; }
    button { border: 0; border-radius: 7px; padding: 9px 18px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { color: white; background: #355d50; }
    button:focus-visible, a:focus-visible { outline: 3px solid #bb7941; outline-offset: 3px; }
    #status { color: #60726d; font-size: 14px; }
    h2 { margin: 0 0 16px; font-size: 22px; }
    section + section { margin-top: 40px; }
    .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 22px 16px; }
    figure { margin: 0; min-width: 0; }
    figure a { display: block; border-radius: 10px; overflow: hidden; background: #e3e5e3; }
    img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; object-position: center 15%; }
    .full img { aspect-ratio: 3/4; object-fit: contain; }
    figcaption { padding-top: 6px; color: #62716c; font: 13px/1.7 ui-monospace, monospace; text-align: center; }
    footer { padding-bottom: 40px; color: #62716c; font-size: 14px; }
    a { color: #355d50; }
    @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 600px) { header, main, footer { padding-left: 14px; padding-right: 14px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 10px; } button { padding: 8px 14px; } }
  </style>
</head>
<body>
  <header>
    <p><a href="顔画像試作_ver5.html">顔立ちの違いを強めた新しい試作（ver5）を見る</a></p>
    <p class="eyebrow">PORTRAIT PREVIEW / VER. 4</p>
    <h1>顔画像の試作 — 男女各10枚</h1>
    <p>頬はなめらかに、丸顔も小ぶりな輪郭に。全員の容姿の水準を引き上げた試作です。</p>
    <p>気になる画像は、下のIDで指定できます。画像を押すと大きく表示します。</p>
    <div class="controls">
      <label><input type="checkbox" id="full"> 胸元まで表示</label>
    </div>
    <p id="status" aria-live="polite">ver4の試作です。旧本番画像の削除に伴い、新旧比較は終了しました。</p>
  </header>
  <main>
    <section aria-labelledby="female-title"><h2 id="female-title">女性 10枚</h2><div id="female" class="grid"></div></section>
    <section aria-labelledby="male-title"><h2 id="male-title">男性 10枚</h2><div id="male" class="grid"></div></section>
    <noscript>表示にはJavaScriptが必要です。<a href="顔画像試作_ver4.md">画像への直接リンク一覧</a>も利用できます。</noscript>
  </main>
  <footer>
    <p>今回は方向性を確認するための20枚です。<a href="顔画像試作_ver4.md">制作記録</a> · <a href="顔画像一覧_ver3.html">旧80枚の公開終了について</a></p>
  </footer>
  <script src="../data/previews/female_faces_v4.js"></script>
  <script src="../data/previews/male_faces_v4.js"></script>
  <script>
    const entries = [];
    for (const [gender, records] of [['female', window.FEMALE_FACE_PREVIEW_V4], ['male', window.MALE_FACE_PREVIEW_V4]]) {
      const grid = document.getElementById(gender);
      for (const record of records) {
        const figure = document.createElement('figure');
        const link = document.createElement('a');
        const image = document.createElement('img');
        image.width = 1200;
        image.height = 1600;
        image.decoding = 'async';
        const caption = document.createElement('figcaption');
        caption.textContent = record.id;
        link.append(image);
        figure.append(link, caption);
        grid.append(figure);
        entries.push({ record, link, image });
      }
    }
    for (const { record, link, image } of entries) {
      link.href = '../' + record.image;
      image.src = link.href;
      image.alt = `${record.id} ver4の試作`;
    }
    document.getElementById('full').addEventListener('change', event => document.querySelector('main').classList.toggle('full', event.target.checked));
  </script>
</body>
</html>
