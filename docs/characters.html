<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>顔タイプのキャラクター図鑑 | SHIAN STUDIO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ee;color:#344331;font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif;font-size:14px;line-height:1.9}header,main,footer{max-width:1100px;margin:auto;padding:28px}header{border-bottom:1px solid #d8dfcf;display:flex;justify-content:space-between;gap:20px}a{color:inherit;text-underline-offset:4px}.brand{font-size:12px;letter-spacing:.12em;text-decoration:none}h1{font:500 clamp(29px,5vw,46px)/1.6 "Noto Serif CJK JP","Yu Mincho",serif;margin:30px 0 14px}.intro{font-size:13px;color:#707964;margin-bottom:30px}.controls{display:flex;gap:10px;position:sticky;top:0;background:#f6f5ee;padding:15px 0;z-index:3}.controls button{font:inherit;padding:9px 23px;border:1px solid #cdd6c1;border-radius:25px;background:transparent;color:#546549;cursor:pointer}.controls button[aria-pressed=true]{background:#53684c;color:white}.type{border-top:1px solid #d8dfcf;padding:30px 0 45px;margin-top:15px}.result{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:40px;align-items:center}.art{background:#e9eddf;border-radius:24px;padding:16px}.art img{width:100%;height:auto;aspect-ratio:1;object-fit:contain;display:block}.number{font-size:11px;color:#7a846f;letter-spacing:.14em}h2{font:500 clamp(23px,3vw,33px)/1.6 "Noto Serif CJK JP","Yu Mincho",serif;margin:13px 0}.classification{text-align:right;color:#7b836f;font-size:12px}.copy{font-size:13px;line-height:2}.examples-title{margin:25px 0 14px;font-size:17px;font-weight:500}.examples{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}.examples figure{margin:0;min-width:0}.examples img{width:100%;height:auto;aspect-ratio:3/4;border-radius:9px;display:block}.examples figcaption{font-size:10px;color:#7b836f;text-align:center;margin-top:5px}.note{font-size:11px;color:#7b836f}.links{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;margin-top:18px}.empty{padding:40px}footer{font-size:11px;color:#7b836f;border-top:1px solid #d8dfcf}button:focus-visible,a:focus-visible{outline:3px solid #be985e;outline-offset:4px}@media(max-width:650px){header,main,footer{padding:20px}.result{grid-template-columns:1fr;gap:20px}.art{max-width:330px;margin:auto;width:100%}.examples{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}.controls button{font-size:12px;padding:8px 14px}.type{padding-bottom:30px}header>a{font-size:10px}}
</style></head><body><header><a class="brand" href="https://type-checker.shianstudio.com/">SHIAN STUDIO</a><a href="character-ogp.html">キャラOGP 20案 ↗</a></header><main><p class="number">FACE TYPE / CHARACTER COLLECTION</p><h1>「好き」が、キャラクターになりました。</h1><p class="intro">男女それぞれ8タイプ。キャラクターを目印に、同じタイプの顔5枚を見比べられます。<br>診断結果と同じ組み合わせを、ここではすべて確認できます。</p><div class="controls" role="group" aria-label="診断対象"><button data-gender="female" aria-pressed="true">女性の8タイプ</button><button data-gender="male" aria-pressed="false">男性の8タイプ</button></div><div id="types"></div><noscript>一覧にはJavaScriptが必要です。<a href="https://type-checker.shianstudio.com/">診断サイトへ</a></noscript></main><footer>キャラクター・顔写真は診断用に生成した画像です。顔のタイプを表すもので、性格や相性を判定するものではありません。</footer>
<script src="../data/female_faces.js"></script><script src="../data/male_faces.js"></script><script src="../data/result_types.js"></script><script src="../data/type_characters.js"></script><script src="../js/type_presentation.js"></script>
<script>
function render(gender){const faces=gender==='female'?FEMALE_FACE_ASSETS:MALE_FACE_ASSETS;const target=document.getElementById('types');target.replaceChildren();FACE_RESULT_TYPES[gender].forEach((type,index)=>{const {character,examples}=TypePresentation.resolve(gender,type.id,faces,FACE_CHARACTERS);const article=document.createElement('article');article.className='type';article.id=gender+'-'+type.id;const result=document.createElement('div');result.className='result';const art=document.createElement('div');art.className='art';const img=document.createElement('img');img.src='../'+character.image;img.alt=type.classification_label+'のキャラクター';img.loading='lazy';art.append(img);const summary=document.createElement('div');const number=document.createElement('p');number.className='number';number.textContent=String(index+1).padStart(2,'0')+' / '+(gender==='female'?'FEMALE':'MALE');const title=document.createElement('h2');title.textContent=type.label;const classification=document.createElement('p');classification.className='classification';classification.textContent='('+type.classification_label+'タイプ)';const copy=document.createElement('p');copy.className='copy';copy.textContent=type.copy;const links=document.createElement('div');links.className='links';const shared=document.createElement('a');shared.href='../share/v8/'+examples[0].id+'/'+type.id+'/';shared.textContent='実際の共有ページを見る ↗';const png=document.createElement('a');png.href='../'+character.image;png.download=character.id+'.png';png.textContent='キャラクターPNG ↓';links.append(shared,png);summary.append(number,title,classification,copy,links);result.append(art,summary);const heading=document.createElement('h3');heading.className='examples-title';heading.textContent='例えば、こんな顔';const grid=document.createElement('div');grid.className='examples';examples.forEach((face,i)=>{const figure=document.createElement('figure');const photo=document.createElement('img');photo.src='../'+face.image;photo.loading='lazy';photo.alt=type.classification_label+'タイプの顔の例 '+(i+1);const caption=document.createElement('figcaption');caption.textContent=face.id;figure.append(photo,caption);grid.append(figure)});article.append(result,heading,grid);target.append(article)});document.querySelectorAll('[data-gender]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.gender===gender)));}document.querySelectorAll('[data-gender]').forEach(button=>button.addEventListener('click',()=>render(button.dataset.gender)));render('female');
</script></body></html>
