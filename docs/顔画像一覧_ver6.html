<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>顔画像一覧 — 男女各60枚 ver6.1</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #242a2b; background: #f8f8f5; font: 16px/1.75 system-ui, sans-serif; }
    header, main, footer { max-width: 1500px; margin: auto; padding: 24px; }
    header { padding-top: 40px; padding-bottom: 8px; }
    h1 { margin: 6px 0 12px; font-size: clamp(26px, 4vw, 40px); line-height: 1.4; }
    header p { margin: 8px 0; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; margin-top: 24px; }
    select, input { max-width: 100%; padding: 8px; font: inherit; color: inherit; border: 1px solid #d9e1dc; border-radius: 7px; background: white; }
    input { width: 200px; }
    a { color: #355d50; }
    :focus-visible { outline: 3px solid #bb7941; outline-offset: 3px; }
    #status, footer { color: #60726d; font-size: 14px; }
    h2 { margin: 0 0 16px; font-size: 22px; }
    section + section { margin-top: 40px; }
    .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 22px 16px; }
    figure { margin: 0; min-width: 0; }
    figure a { display: block; border-radius: 10px; overflow: hidden; background: #e3e5e3; }
    img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; object-position: center 15%; }
    .full img { aspect-ratio: 3/4; object-fit: contain; }
    .features figure a { position: relative; aspect-ratio: 1; }
    .features img { position: absolute; width: 185%; height: auto; aspect-ratio: 3/4; left: -42.5%; top: -55%; }
    figcaption { padding-top: 6px; color: #62716c; font: 13px/1.7 ui-monospace, monospace; text-align: center; }
    [hidden] { display: none !important; }
    @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 600px) { header, main, footer { padding-left: 14px; padding-right: 14px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 10px; } }
  </style>
</head>
<body>
  <header>
    <h1>顔画像一覧 — 男女各60枚</h1>
    <p>ver6.1の設定から生成した120人です。全員が自然な下ろし前髪。現在の診断で使用している本番セットです。画像を押すと原寸で確認できます。</p>
    <p><a href="顔設定一覧_男女各60人_ver6.html">設定一覧</a> · <a href="顔画像生成_ver6.md">制作記録</a> · <a href="顔画像試作_ver5.html">前回の試作</a></p>
    <div class="controls">
      <label>性別 <select id="gender"><option value="all">男女両方</option><option value="female">女性</option><option value="male">男性</option></select></label>
      <label>表示 <select id="framing"><option value="portrait">通常</option><option value="features">顔を大きく</option><option value="full">胸元まで</option></select></label>
      <label>ID検索 <input id="search" type="search" placeholder="例: female_060" autocomplete="off"></label>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </header>
  <main>
    <section id="female-section" aria-labelledby="female-title"><h2 id="female-title">女性 60枚</h2><div id="female" class="grid"></div></section>
    <section id="male-section" aria-labelledby="male-title"><h2 id="male-title">男性 60枚</h2><div id="male" class="grid"></div></section>
    <noscript>表示にはJavaScriptが必要です。<a href="顔画像生成_ver6.md">画像への直接リンク一覧</a>も利用できます。</noscript>
  </main>
  <footer><p>画像下のIDで人物を指定できます。特徴量は生成目標であり、写真の実測値ではありません。</p></footer>
  <script src="../data/female_faces.js?v=6.1"></script>
  <script src="../data/male_faces.js?v=6.1"></script>
  <script>
    const entries = [];
    for (const [gender, records] of [['female', window.FEMALE_FACE_ASSETS], ['male', window.MALE_FACE_ASSETS]]) {
      for (const record of records) {
        const figure = document.createElement('figure');
        const link = document.createElement('a');
        link.href = '../' + record.image + '?v=' + encodeURIComponent(record.asset_version);
        const image = document.createElement('img');
        image.width = 1200;
        image.height = 1600;
        image.loading = 'lazy';
        image.decoding = 'async';
        image.src = link.href;
        image.alt = record.id;
        const caption = document.createElement('figcaption');
        caption.textContent = record.id;
        link.append(image);
        figure.append(link, caption);
        document.getElementById(gender).append(figure);
        entries.push({ record, figure });
      }
    }
    function filter() {
      const gender = document.getElementById('gender').value;
      const query = document.getElementById('search').value.trim().toLowerCase();
      const counts = { female: 0, male: 0 };
      for (const { record, figure } of entries) {
        figure.hidden = (gender !== 'all' && record.gender !== gender) || !record.id.includes(query);
        if (!figure.hidden) counts[record.gender]++;
      }
      for (const [key, name] of [['female', '女性'], ['male', '男性']]) {
        document.getElementById(key + '-section').hidden = counts[key] === 0;
        document.getElementById(key + '-title').textContent = `${name} ${counts[key]}枚`;
      }
      const count = counts.female + counts.male;
      document.getElementById('status').textContent = count ? `${count}枚を表示しています。` : '該当するIDがありません。';
    }
    document.getElementById('gender').addEventListener('change', filter);
    document.getElementById('search').addEventListener('input', filter);
    document.getElementById('framing').addEventListener('change', event => { document.querySelector('main').className = event.target.value; });
    filter();
  </script>
</body>
</html>
