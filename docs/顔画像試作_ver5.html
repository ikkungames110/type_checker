<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>顔画像の試作 — 男女各10枚 ver5</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #242a2b; background: #f8f8f5; font: 16px/1.75 system-ui, sans-serif; }
    main, header, footer { max-width: 1500px; margin: auto; padding: 24px; }
    header { padding-top: 40px; padding-bottom: 8px; }
    .eyebrow { margin: 0; color: #60726d; font-size: 13px; letter-spacing: .12em; }
    h1 { margin: 6px 0 12px; font-size: clamp(26px, 4vw, 40px); line-height: 1.4; }
    header p { margin: 8px 0; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; margin-top: 24px; }
    .versions { display: flex; gap: 4px; padding: 4px; border: 1px solid #d9e1dc; border-radius: 10px; background: white; }
    button { border: 0; border-radius: 7px; padding: 9px 18px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { color: white; background: #355d50; }
    button:focus-visible, a:focus-visible { outline: 3px solid #bb7941; outline-offset: 3px; }
    #status { color: #60726d; font-size: 14px; }
    h2 { margin: 0 0 16px; font-size: 22px; }
    section + section { margin-top: 40px; }
    .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 22px 16px; }
    figure { margin: 0; min-width: 0; }
    figure a { display: block; border-radius: 10px; overflow: hidden; background: #e3e5e3; }
    img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; object-position: center 15%; }
    .full img { aspect-ratio: 3/4; object-fit: contain; }
    .features figure a { position: relative; aspect-ratio: 1; }
    .features img { position: absolute; width: 185%; height: auto; aspect-ratio: 3/4; left: -42.5%; top: -55%; }
    select { padding: 8px; font: inherit; color: inherit; border: 1px solid #d9e1dc; border-radius: 7px; background: white; }
    figcaption { padding-top: 6px; color: #62716c; font: 13px/1.7 ui-monospace, monospace; text-align: center; }
    footer { padding-bottom: 40px; color: #62716c; font-size: 14px; }
    a { color: #355d50; }
    @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 600px) { header, main, footer { padding-left: 14px; padding-right: 14px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 10px; } button { padding: 8px 14px; } }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">PORTRAIT PREVIEW / VER. 5</p>
    <h1>顔画像の試作 — 男女各10枚</h1>
    <p><a href="顔設定一覧_男女各60人_ver6.html">この試作を基にした、男女各60人の設定一覧</a></p>
    <p>目・眉・鼻・輪郭の組み合わせを、1人ずつはっきり変えた試作です。頬の自然な厚みと、整った容姿は共通条件にしています。</p>
    <p>気になる画像は、下のIDで指定できます。画像を押すと大きく表示します。</p>
    <div class="controls">
      <div class="versions" aria-label="表示する画像のバージョン">
        <button type="button" id="new" aria-pressed="true">新しい試作</button>
        <button type="button" id="old" aria-pressed="false">前回の試作</button>
      </div>
      <label>表示 <select id="framing"><option value="portrait">通常</option><option value="features">顔を大きく</option><option value="full">胸元まで</option></select></label>
    </div>
    <p id="status" aria-live="polite">新しい試作を表示しています。</p>
  </header>
  <main>
    <section aria-labelledby="female-title"><h2 id="female-title">女性 10枚</h2><div id="female" class="grid"></div></section>
    <section aria-labelledby="male-title"><h2 id="male-title">男性 10枚</h2><div id="male" class="grid"></div></section>
    <noscript>表示にはJavaScriptが必要です。<a href="顔画像試作_ver5.md">画像への直接リンク一覧</a>も利用できます。</noscript>
  </main>
  <footer>
    <p>今回は方向性を確認するための20枚です。<a href="顔画像試作_ver5.md">制作記録</a> · <a href="顔画像試作_ver4.html">前回の試作一覧</a></p>
  </footer>
  <script src="../data/previews/female_faces_v4.js"></script>
  <script src="../data/previews/male_faces_v4.js"></script>
  <script src="../data/previews/female_faces_v5.js"></script>
  <script src="../data/previews/male_faces_v5.js"></script>
  <script>
    const entries = [];
    for (const [gender, records] of [['female', window.FEMALE_FACE_PREVIEW_V5], ['male', window.MALE_FACE_PREVIEW_V5]]) {
      const grid = document.getElementById(gender);
      const previous = gender === 'female' ? window.FEMALE_FACE_PREVIEW_V4 : window.MALE_FACE_PREVIEW_V4;
      for (const [index, record] of records.entries()) {
        const figure = document.createElement('figure');
        const link = document.createElement('a');
        const image = document.createElement('img');
        image.width = 1200;
        image.height = 1600;
        image.decoding = 'async';
        const caption = document.createElement('figcaption');
        caption.textContent = record.id;
        link.append(image);
        figure.append(link, caption);
        grid.append(figure);
        entries.push({ record, previous: previous[index], link, image, caption });
      }
    }
    function showVersion(version) {
      const old = version === 'old';
      for (const { record, previous, link, image, caption } of entries) {
        const shown = old ? previous : record;
        link.href = '../' + shown.image;
        caption.textContent = shown.id;
        image.src = link.href;
        image.alt = `${shown.id} ${old ? '前回の試作' : '新しい試作'}`;
      }
      document.getElementById('new').setAttribute('aria-pressed', String(!old));
      document.getElementById('old').setAttribute('aria-pressed', String(old));
      document.getElementById('status').textContent = old
        ? '前回の試作20枚を表示しています。今回とは別の顔立ち・IDです。'
        : '新しい試作を表示しています。';
    }
    document.getElementById('new').addEventListener('click', () => showVersion('new'));
    document.getElementById('old').addEventListener('click', () => showVersion('old'));
    document.getElementById('framing').addEventListener('change', event => { document.querySelector('main').className = event.target.value; });
    showVersion('new');
  </script>
</body>
</html>
