<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>3文字の結果カード</title><style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:600px;background:#f3f3e9;color:#42543b;font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif}main{display:grid;grid-template-columns:530px 1fr;gap:30px;height:600px;padding:40px 48px}.copy{display:flex;flex-direction:column;justify-content:center;min-width:0}.brand{font-size:20px;margin:0 0 37px;letter-spacing:.08em}.target{font-size:18px;color:#7c8870;margin:0 0 14px}.codes{display:flex;flex-wrap:wrap;gap:0 17px;align-items:center;font:98px/1.4 Georgia,serif;letter-spacing:.02em}.codes i{font:46px Georgia;color:#9ba98c}.codes.count-4{font-size:71px}.codes.count-8{font-size:56px}.codes.count-8 i{font-size:29px}.type-title{font-family:"Noto Serif CJK JP","Yu Mincho",serif;font-size:29px;line-height:1.6;margin:18px 0 0}.invite{font-size:17px;margin:25px 0 0;color:#728066}.footer{font-size:12px;letter-spacing:.15em;color:#94a087;margin-top:25px}.characters{display:grid;grid-template-columns:1fr;gap:10px;align-content:center}.characters.count-2{grid-template-columns:repeat(2,minmax(0,1fr))}.characters.count-4{grid-template-columns:repeat(2,minmax(0,1fr))}.characters.count-8{grid-template-columns:repeat(4,minmax(0,1fr))}.characters figure{margin:0;background:#e5ead9;border-radius:120px 120px 14px 14px;min-width:0;text-align:center;height:470px;padding:12px}.characters img{display:block;width:100%;height:425px;object-fit:contain}.characters figcaption{font:25px Georgia;letter-spacing:.1em}.characters.count-2 figure{height:389px;padding:4px}.characters.count-2 img{height:345px}.characters.count-4 figure,.characters.count-8 figure{height:235px;padding:7px}.characters.count-4 img,.characters.count-8 img{height:193px}.characters.count-8 figcaption{font-size:20px}.characters figure:nth-child(2n){background:#ece1d9}.characters figure:nth-child(3n){background:#e5dfeb}
.dense .brand{margin-bottom:18px}.dense .target{font-size:17px;margin-bottom:8px}.dense .type-title{font-size:26px;margin-top:12px}.dense .invite{margin-top:18px}.dense .footer{margin-top:15px}</style></head><body><main><div class="copy"><p class="brand">好みの顔タイプ診断</p><p class="target" id="target"></p><div id="codes" class="codes"></div><p id="type-title" class="type-title"></p><p class="invite">気になる顔を、直感で20回。<br>あなたの「好き」は、どの3文字？</p><p class="footer">SHIAN STUDIO / 3 LETTERS</p></div><div id="characters" class="characters"></div></main></body></html>
