<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${title} | 好みの顔タイプ診断</title>
  <meta name="description" content="${description}">
  <link rel="canonical" href="${page_url}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="好みの顔タイプ診断">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="${title} | 好みの顔タイプ診断">
  <meta property="og:description" content="${description}">
  <meta property="og:url" content="${page_url}">
  <meta property="og:image" content="${card_url}">
  <meta property="og:image:secure_url" content="${card_url}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="600">
  <meta property="og:image:alt" content="${image_alt}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="${title} | 好みの顔タイプ診断">
  <meta name="twitter:description" content="${description}">
  <meta name="twitter:image" content="${card_url}">
  <meta name="twitter:image:alt" content="${image_alt}">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #161616; background: linear-gradient(135deg, #fff3f5, #fbfaf7 50%, #eaf3f3); font: 16px/1.8 "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif; }
    main { max-width: 940px; margin: 0 auto; padding: 32px 20px 48px; }
    .brand { color: #161616; font-size: 19px; font-weight: 800; text-decoration: none; }
    .result { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); align-items: center; gap: 36px; margin-top: 28px; }
    .portrait { display: block; width: 100%; height: auto; border: 12px solid #fff; border-radius: 10px; box-shadow: 0 18px 48px #201d191f; }
    .eyebrow { color: #666a70; font-size: 14px; }
    h1 { margin: 12px 0 20px; color: #d84861; font-size: clamp(28px, 5vw, 42px); line-height: 1.35; }
    .cta { display: block; margin-top: 28px; padding: 16px; background: #d84861; border-radius: 8px; color: #fff; text-align: center; text-decoration: none; font-size: 18px; font-weight: 800; }
    .cta:hover { background: #bb354d; }
    a:focus-visible { outline: 3px solid #277e8e; outline-offset: 4px; }
    footer { margin-top: 32px; color: #666a70; font-size: 13px; }
    @media (max-width: 650px) { .result { grid-template-columns: 1fr; gap: 24px; } .portrait { max-width: 380px; margin: auto; } .summary { grid-row: 1; } }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="../../../../top/">好みの顔タイプ診断</a>
    <section class="result">
      <img class="portrait" src="../../../../${portrait_path}" width="1200" height="1600" alt="${image_alt}">
      <div class="summary">
        <p class="eyebrow">シェアされた診断結果 · ${gender_label}の顔</p>
        <h1>${title}</h1>
        <p>20問の2択で見つかった、好みの顔です。<br>あなたは、どんな顔がタイプ？</p>
        <a class="cta" href="../../../../top/">自分のタイプを診断する</a>
      </div>
    </section>
    <footer>写真は診断用にAIで生成した架空の成人です。SHIAN STUDIO</footer>
  </main>
</body>
</html>
