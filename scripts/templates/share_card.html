<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>顔写真付き共有カード</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 600px; background: #fbfaf7; color: #161616; font-family: "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic", sans-serif; }
  main { display: grid; grid-template-columns: 450px 1fr; height: 600px; }
  img { display: block; width: 450px; height: 600px; }
  .copy { padding: 42px 54px; display: flex; flex-direction: column; background: linear-gradient(145deg, #fff3f5, #fbfaf7 60%, #eaf3f3); }
  .brand { margin: 0; font-size: 25px; font-weight: 700; }
  .eyebrow { margin: 50px 0 14px; color: #666a70; font-size: 24px; }
  h1 { margin: 0; font-size: 68px; line-height: 1.35; letter-spacing: 0; font-weight: 900; }
  h1 span { color: #d84861; }
  .invite { margin: 28px 0 0; font-size: 24px; line-height: 1.7; }
  .footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 18px; }
  .tag { border: 1px solid #e6cbd1; border-radius: 30px; padding: 10px 18px; color: #823041; font-size: 21px; font-weight: 700; background: #fff3f5; }
  .studio { color: #666a70; font-size: 17px; }
</style>
<main>
  <img id="portrait" alt="診断結果の顔写真" width="450" height="600">
  <div class="copy">
    <p class="brand">好みの顔タイプ診断</p>
    <p class="eyebrow" id="target">私が惹かれる顔は…</p>
    <h1>私のタイプは<br><span>こんな顔。</span></h1>
    <p class="invite">20問の2択で見つかる。<br>あなたは、どんな顔がタイプ？</p>
    <div class="footer"><span class="tag">#好みの顔タイプ診断</span><span class="studio">SHIAN STUDIO</span></div>
  </div>
</main>
</html>
