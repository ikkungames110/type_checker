<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>広告 | 好みの顔タイプ診断</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf8f5; color: #38332f; font-family: system-ui, sans-serif; }
    .countdown { position: fixed; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); width: 64px; height: 64px; z-index: 1; background: #fff; border-radius: 50%; box-shadow: 0 2px 12px #00000012; }
    .countdown svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .countdown circle { fill: none; stroke-width: 4; }
    .track { stroke: #e9e3dc; }
    .meter { stroke: #9c7157; stroke-linecap: round; }
    #seconds { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
    main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 104px 0 32px; gap: 16px; }
    .caption { margin: 0; font-size: 12px; color: #756c65; }
    .ad-slots { display: flex; justify-content: center; gap: 24px; }
    .ad-slots iframe { display: block; width: 300px; height: 250px; border: 0; }
  </style>
</head>
<body>
  <div class="countdown" role="timer" aria-label="トップへ戻るまであと10秒">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle class="track" cx="32" cy="32" r="27" />
      <circle class="meter" cx="32" cy="32" r="27" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" />
    </svg>
    <span id="seconds" aria-hidden="true">10</span>
  </div>
  <script>
    const started = performance.now();
    const timer = document.querySelector('.countdown');
    const seconds = document.querySelector('#seconds');
    const meter = document.querySelector('.meter');
    function tick() {
      const elapsed = performance.now() - started;
      const remaining = Math.max(0, Math.ceil((10000 - elapsed) / 1000));
      seconds.textContent = remaining;
      timer.setAttribute('aria-label', `トップへ戻るまであと${remaining}秒`);
      meter.setAttribute('stroke-dashoffset', Math.min(1, elapsed / 10000));
      if (elapsed >= 10000) {
        location.replace('/top/');
        return;
      }
      setTimeout(tick, 50);
    }
    tick();
  </script>
  <main>
    <p class="caption">広告</p>
    <div class="ad-slots" id="adSlots"></div>
    <template id="mobileAd">
<div id="im-379147c83640400880bdda3d09b72a26">

</div>
    </template>
    <template id="desktopAd">
<div id="im-518b03eea784416c8659a62414ac73d1">
  <script async src="https://imp-adedge.i-mobile.co.jp/script/v1/spot.js?20220104"></script>
  <script>(window.adsbyimobile=window.adsbyimobile||[]).push({pid:85394,mid:596134,asid:1944299,type:"banner",display:"inline",elementid:"im-518b03eea784416c8659a62414ac73d1"})</script>
</div>
    </template>
    <script>
      const slots = document.querySelector('#adSlots');
      if (window.matchMedia('(min-width: 800px)').matches) {
        // 各タグを独立した文書で実行し、指定されたIDとタグをそのまま使う。
        for (let i = 0; i < 2; i++) {
          const frame = document.createElement('iframe');
          frame.title = `広告 ${i + 1}`;
          frame.srcdoc = '<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>body{margin:0}body>div{display:flow-root}</style></head><body>' + document.querySelector('#desktopAd').innerHTML + '</body></html>';
          frame.addEventListener('load', () => {
            const ad = frame.contentDocument.body.firstElementChild;
            const observer = new ResizeObserver(() => {
              frame.style.height = `${Math.max(250, ad.scrollHeight)}px`;
            });
            observer.observe(ad);
          });
          slots.append(frame);
        }
      } else {
        slots.append(document.querySelector('#mobileAd').content.cloneNode(true));
      }
    </script>
  </main>
  <noscript><p>トップへ戻るにはJavaScriptを有効にするか、<a href="/top/">こちら</a>を押してください。</p></noscript>
</body>
</html>
